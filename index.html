<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나만의 AI 캐릭터 조합기</title><style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#23354d;background:#f4f8ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1020px;margin:auto;padding:25px 18px 50px}header{background:linear-gradient(120deg,#416dcc,#7c87e9);color:white;border-radius:23px;padding:25px 28px}h1{font-size:clamp(23px,4vw,34px);margin:0 0 9px}h2{font-size:20px;margin:0 0 17px}p{line-height:1.55}header p{margin:0;color:#edf3ff}.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:19px}.panel,.output{background:white;border:1px solid #e0e8f4;border-radius:19px;padding:20px;box-shadow:0 3px 14px #2c5e9d0a}.num{display:inline-grid;place-items:center;background:#eaf0ff;color:#4166ba;border-radius:50%;width:32px;height:32px;margin-right:6px;font-weight:800}label{display:block;font-weight:700;margin:10px 0 7px}select,input,textarea{width:100%;border:1px solid #cbd8e9;background:white;border-radius:11px;padding:12px 13px;font:inherit;font-size:15px}input{margin-top:9px}small{color:#63758f;display:block;margin-top:7px}button{background:#4269c5;color:white;border:0;border-radius:11px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer}button.secondary{background:#e9f0ff;color:#325cae}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f9bb58}button:hover{filter:brightness(.96)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.output{border:2px solid #bbcaed}.output h2{margin-bottom:8px}.hint{color:#61728a;font-size:13px}.preview{font-weight:700;color:#3e60a0;background:#eef4ff;border-radius:10px;padding:12px;margin:15px 0}textarea{min-height:198px;line-height:1.7;resize:vertical}.checkbox{display:flex;align-items:center;gap:8px;font-weight:400;margin:14px 0}.checkbox input{width:auto;margin:0}.note{font-size:13px;color:#667994}.footer{text-align:center;color:#60718a;font-size:13px;margin-top:25px}@media(max-width:700px){.panels{grid-template-columns:1fr}.wrap{padding:12px}.panel{padding:17px}}@media print{header{color:#24354d;background:white}.toolbar{display:none}.panels{grid-template-columns:1fr 1fr}.wrap{padding:0}.panel,.output{box-shadow:none}}
</style></head><body><div class="wrap"><header><h1>🎨 나만의 AI 캐릭터 조합기</h1><p>좋아하는 것을 고르고, 새로운 생각을 직접 더해 보세요! 완성된 문장을 AI에게 보여 줄 수 있어요.</p></header>
<div class="panels" id="panels"></div>
<div class="panel" style="margin-top:16px"><h2>✨ 내 캐릭터만의 특별한 설정</h2><label for="charName">캐릭터 이름</label><input id="charName" placeholder="예: 딸기번개, 구름토끼"><label for="scene">캐릭터가 하고 있는 행동 또는 소품 (직접 입력)</label><input id="scene" placeholder="예: 별 모양 가방을 메고 춤추는 모습"><label for="color">주로 사용할 색깔 (직접 입력)</label><input id="color" placeholder="예: 민트색과 분홍색"><label for="extra">추가 아이디어 (마음껏 입력!)</label><textarea id="extra" style="min-height:82px" placeholder="예: 귀는 하트 모양으로, 꼬리에는 작은 별이 있어요."></textarea><label class="checkbox"><input type="checkbox" id="nameOnImage">AI에게 그림 안에 이름도 넣어 달라고 하기 (글자는 틀릴 수 있어요)</label></div>
<div class="toolbar"><button id="generate">🪄 AI 요청 문장 만들기</button><button class="secondary" id="random">🎲 무작위 조합</button><button class="secondary" id="reset">↺ 처음부터</button></div>
<section class="output"><h2>📝 완성된 AI 그림 요청 문장</h2><div id="summary" class="preview">선택지를 고르면 여기에 캐릭터 특징이 나타나요.</div><textarea id="result" aria-label="완성된 AI 프롬프트" placeholder="위에서 특징을 선택하고 문장 만들기를 눌러 보세요."></textarea><div class="toolbar" style="margin-bottom:0"><button id="copy">📋 문장 복사</button><button class="secondary" id="save">💾 문장 파일 저장</button><button class="secondary" id="print">🖨️ 인쇄</button></div><p id="notice" role="status" aria-live="polite" class="hint">문장을 직접 고쳐도 괜찮아요. 복사한 뒤 이미지 생성 AI 입력창에 붙여 넣으세요.</p></section>
<p class="footer">어린이 안전 약속: 이름, 학교, 얼굴 사진 등 개인정보는 AI에 입력하지 않아요. 뜨거운 컵 승화전사는 선생님과 함께해요.</p></div>
<script>
const groups=[{title:'캐릭터 종류',options:['고양이','강아지','토끼','공룡','로봇','딸기','구름','연필','우산']},{title:'성격',options:['용감한','장난꾸러기','친절한','수줍은','호기심 많은','엉뚱한','밝고 활발한']},{title:'특별한 능력',options:['하늘 날기','순간 이동','변신하기','빛 만들기','물건 찾기','식물 키우기','비를 멈추게 하기']},{title:'꾸미기',options:['왕관','망토','안경','리본','모자','가방','반짝이는 신발']}];
const root=document.getElementById('panels');for(let i=0;i<groups.length;i++){const g=groups[i];const div=document.createElement('div');div.className='panel';const h=document.createElement('h2');h.textContent=`${i+1}. ${g.title}`;div.appendChild(h);const label=document.createElement('label');label.htmlFor=`select${i}`;label.textContent='하나를 골라 보세요';div.appendChild(label);const sel=document.createElement('select');sel.id=`select${i}`;sel.innerHTML='<option value="">-- 골라 주세요 --</option>';g.options.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o)});div.appendChild(sel);const inp=document.createElement('input');inp.id=`custom${i}`;inp.placeholder=`직접 입력: 나만의 ${g.title} 쓰기`;inp.setAttribute('aria-label',g.title+' 직접 입력');div.appendChild(inp);const s=document.createElement('small');s.textContent='직접 입력한 내용이 있으면 선택한 것보다 우선해요.';div.appendChild(s);root.appendChild(div);}
const el=id=>document.getElementById(id);const vals=()=>groups.map((g,i)=>el(`custom${i}`).value.trim()||el(`select${i}`).value||['동물','밝고 친절한','특별한 능력','멋진 장식'][i]);
function build(){const [type,personality,power,deco]=vals();const name=el('charName').value.trim(),action=el('scene').value.trim(),color=el('color').value.trim(),extra=el('extra').value.trim();let str=`초등학생이 디자인한 세상에 하나뿐인 귀여운 ${type} 캐릭터를 그려 줘.\n\n`;str+=`캐릭터의 성격은 ${personality} 느낌이고, 특별한 능력은 '${power}'이야. ${deco}으로 꾸며 줘.\n`;if(color)str+=`주로 사용할 색깔은 ${color}이야.\n`;if(action)str+=`캐릭터는 ${action} 모습을 하고 있어.\n`;if(extra)str+=`추가로 꼭 표현할 특징: ${extra}\n`;str+='\n디자인 조건: 둥글고 단순한 모양, 밝고 선명한 색, 귀여운 2D 스티커 일러스트 스타일. 흰색 배경, 캐릭터 하나만 중앙에 크게 그려 줘. 작은 머그컵에 인쇄해도 잘 보이도록 윤곽을 또렷하게 그리고 복잡한 배경은 빼 줘.';str+=el('nameOnImage').checked?(name?`\n가능하면 캐릭터 이름 '${name}'을 정확하게 넣어 줘.`:'\n문구를 넣지 말아 줘.'):'\n글자와 글씨는 넣지 말아 줘.';el('result').value=str;el('summary').textContent=`${name?name+' | ':''}${type} · ${personality} · ${power} · ${deco}`;el('notice').textContent='완성! 문장을 수정하거나 복사할 수 있어요.';}
el('generate').addEventListener('click',build);el('random').addEventListener('click',()=>{groups.forEach((g,i)=>{el(`select${i}`).value=g.options[Math.floor(Math.random()*g.options.length)];el(`custom${i}`).value='';});build();});el('reset').addEventListener('click',()=>{document.querySelectorAll('input:not([type=checkbox]), textarea').forEach(x=>x.value='');document.querySelectorAll('select').forEach(x=>x.value='');el('nameOnImage').checked=false;el('summary').textContent='선택지를 고르면 여기에 캐릭터 특징이 나타나요.';el('notice').textContent='처음 상태로 돌아왔어요.';});el('copy').addEventListener('click',async()=>{const v=el('result').value;if(!v){el('notice').textContent='먼저 AI 요청 문장을 만들어 주세요.';return;}try{await navigator.clipboard.writeText(v);el('notice').textContent='문장을 복사했어요! AI 입력창에 붙여 넣으세요.';}catch(e){el('result').focus();el('result').select();try{document.execCommand('copy');el('notice').textContent='문장을 복사했어요.';}catch(e){el('notice').textContent='문장을 선택했어요. Ctrl+C로 복사해 주세요.';}}});el('save').addEventListener('click',()=>{if(!el('result').value)build();const blob=new Blob([el('result').value],{type:'text/plain;charset=utf-8'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='나의_AI_캐릭터_프롬프트.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);});el('print').addEventListener('click',()=>window.print());groups.forEach((g,i)=>{el(`select${i}`).addEventListener('change',build);el(`custom${i}`).addEventListener('input',build)});['charName','scene','color','extra','nameOnImage'].forEach(id=>el(id).addEventListener('input',build));
</script></body></html>
